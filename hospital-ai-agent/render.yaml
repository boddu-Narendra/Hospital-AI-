# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  # ---------------------------------------------------------------------------
  # Backend API Service (FastAPI / Python + MongoDB Atlas)
  # ---------------------------------------------------------------------------
  - type: web
    name: hospital-ai-agent-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGIN_REGEX
        value: "^https://.*(\\.onrender\\.com|\\.vercel\\.app)$"
      - key: FRONTEND_URL
        value: "https://hospital-ai-one.vercel.app"
