# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  # ---------------------------------------------------------------------------
  # Backend API Service (FastAPI / Python)
  # ---------------------------------------------------------------------------
  - type: web
    name: hospital-ai-agent-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ALLOWED_ORIGIN_REGEX
        value: "^https://.*\\.onrender\\.com$"
      - key: FRONTEND_URL
        sync: false

  # ---------------------------------------------------------------------------
  # Frontend Static Site (React Vite SPA)
  # ---------------------------------------------------------------------------
  - type: web
    name: hospital-ai-agent-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
